<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Babe Fragrances</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0c0c0e;
    --surface:   #141416;
    --surface2:  #1c1c20;
    --border:    #2a2a30;
    --gold:      #c9a96e;
    --gold-dim:  #8a6f42;
    --law:       #7b9cbe;
    --law-dim:   #3d5a78;
    --mily:      #be7b9c;
    --mily-dim:  #783d5a;
    --text:      #e8e4dc;
    --text-muted:#8a8680;
    --radius:    12px;
    --transition:.22s ease;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; min-height: 100vh; }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(12,12,14,.92); backdrop-filter: blur(12px) saturate(160%);
    border-bottom: 1px solid transparent;
    transition: border-bottom-color .2s ease;
    padding: 0 clamp(16px,4vw,48px);
    padding-top: env(safe-area-inset-top, 0px);
    display: flex; align-items: center; justify-content: space-between;
    height: calc(64px + env(safe-area-inset-top, 0px)); gap: 16px;
  }
  header.scrolled { border-bottom-color: var(--border); }
  .logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; letter-spacing: .12em; color: var(--gold); white-space: nowrap; }
  .logo span { font-style: italic; color: var(--text-muted); font-size: 14px; letter-spacing: .05em; margin-left: 8px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  input[type="search"] { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px 8px 34px; color: var(--text); font-size: 13px; width: 220px; outline: none; transition: border-color var(--transition); }
  input[type="search"]:focus { border-color: var(--gold-dim); }
  input[type="search"]::placeholder { color: var(--text-muted); }

  /* SYNC indicator */
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); transition: background .4s; flex-shrink: 0; }
  .sync-dot.syncing { background: var(--gold); animation: pulse .8s infinite alternate; }
  .sync-dot.ok      { background: #6dbf8a; }
  .sync-dot.err     { background: #e07070; }
  @keyframes pulse { to { opacity: .3; } }

  /* BUTTONS */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; border: none; font-family: inherit; transition: all var(--transition); white-space: nowrap; -webkit-tap-highlight-color: transparent; }
  .btn:active { transform: scale(0.96); transition: transform 80ms ease-out; }
  .btn-gold:active { background: #b8924f; }
  .btn-gold { background: var(--gold); color: #0c0c0e; font-weight: 500; }
  .btn-gold:hover { background: #d4b882; }
  .btn-outline { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
  .btn-outline:hover { border-color: var(--gold-dim); color: var(--text); }
  .btn-danger { background: rgba(190,60,60,.15); color: #e07070; border: 1px solid rgba(190,60,60,.3); }
  .btn-danger:hover { background: rgba(190,60,60,.3); }
  .btn-sm { padding: 6px 10px; font-size: 12px; }

  /* TABS */
  .tabs-row { display: flex; align-items: center; gap: 8px; padding: 20px clamp(16px,4vw,48px) 0; flex-wrap: wrap; }
  .tab { padding: 8px 20px; border-radius: 100px; font-size: 13px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text-muted); transition: all var(--transition); font-family: inherit; -webkit-tap-highlight-color: transparent; }
  .tab:active { transform: scale(0.94); transition: transform 80ms ease-out; }
  .tab.active-all  { background: var(--gold);  border-color: var(--gold);  color: #0c0c0e; }
  .tab.active-law  { background: var(--law);   border-color: var(--law);   color: #0c0c0e; }
  .tab.active-mily { background: var(--mily);  border-color: var(--mily);  color: #0c0c0e; }
  .tab:hover:not(.active-all):not(.active-law):not(.active-mily) { border-color: var(--gold-dim); color: var(--text); }
  .tabs-spacer { flex: 1; }

  /* FILTER ROW */
  .filter-row { display: flex; align-items: center; gap: 8px; padding: 10px clamp(16px,4vw,48px) 0; flex-wrap: wrap; }
  .filter-row-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; margin-right: 2px; }
  .filter-chip { padding: 5px 14px; border-radius: 100px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text-muted); transition: all var(--transition); font-family: inherit; -webkit-tap-highlight-color: transparent; }
  .filter-chip:active { transform: scale(0.94); transition: transform 80ms ease-out; }
  .filter-chip.active-chip { background: var(--surface2); border-color: var(--gold-dim); color: var(--text); }

  select { background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); border-radius: 8px; padding: 7px 10px; font-size: 12px; font-family: inherit; outline: none; cursor: pointer; }
  select:focus { border-color: var(--gold-dim); }
  select option { background: var(--surface2); color: var(--text); }

  /* STATS */
  .stats-bar { display: flex; gap: 24px; padding: 16px clamp(16px,4vw,48px); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .stat { display: flex; align-items: baseline; gap: 6px; }
  .stat-n { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; color: var(--gold); line-height: 1; }
  .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; }
  .stat-sep { width: 1px; background: var(--border); align-self: stretch; }

  /* GRID */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 16px; padding: 24px clamp(16px,4vw,48px) 48px; }

  /* CARD */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; position: relative; transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition); display: flex; flex-direction: column; -webkit-tap-highlight-color: transparent; }
  .card:hover { transform: translateY(-4px); border-color: var(--gold-dim); box-shadow: 0 12px 40px rgba(0,0,0,.5); will-change: transform; }
  .card:active { transform: scale(0.97) translateY(-1px); transition: transform 80ms ease-out; border-color: var(--gold-dim); }
  .card-badge { position: absolute; top: 10px; left: 10px; z-index: 2; padding: 3px 8px; border-radius: 100px; font-size: 10px; font-weight: 500; letter-spacing: .06em; }
  .badge-law  { background: rgba(123,156,190,.2); color: var(--law);  border: 1px solid rgba(123,156,190,.3); }
  .badge-mily { background: rgba(190,123,156,.2); color: var(--mily); border: 1px solid rgba(190,123,156,.3); }
  .badge-probado { position: absolute; top: 10px; right: 10px; z-index: 2; background: rgba(201,169,110,.15); color: var(--gold); border: 1px solid rgba(201,169,110,.3); padding: 3px 8px; border-radius: 100px; font-size: 10px; }
  .card-img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--surface2); }
  .card-img-placeholder { width: 100%; aspect-ratio: 1; background: var(--surface2); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; color: var(--text-muted); font-size: 11px; text-align: center; padding: 12px; }
  .card-img-placeholder svg { opacity: .3; }
  .card-img-loading {
    width: 100%; aspect-ratio: 1;
    background: linear-gradient(90deg, var(--surface2) 25%, #252528 50%, var(--surface2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.6s ease-in-out infinite;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .card-name { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 400; line-height: 1.25; letter-spacing: -0.01em; }
  .card-brand { font-size: 11px; color: var(--text-muted); letter-spacing: .04em; }
  .card-stars { display: flex; gap: 1px; margin-top: 2px; align-items: center; }
  .card-price { font-size: 12px; color: var(--gold); margin-top: auto; padding-top: 6px; font-weight: 300; }
  .card-occasion { font-size: 11px; color: var(--text-muted); background: var(--surface2); border-radius: 4px; padding: 2px 6px; display: inline-block; width: fit-content; }
  .empty { grid-column: 1/-1; text-align: center; padding: 80px 20px; color: var(--text-muted); }
  .empty p { font-size: 15px; margin-top: 16px; }

  /* LOADING SCREEN */
  .loading-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 999; transition: opacity .4s; }
  .loading-screen.hide { opacity: 0; pointer-events: none; }
  .loading-logo { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; color: var(--gold); letter-spacing: .15em; }
  .loading-sub { font-size: 12px; color: var(--text-muted); }

  /* SPINNER */
  .spinner { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--gold); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* MODAL */
  .modal-backdrop { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.75); backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; padding: 0; opacity: 0; pointer-events: none; transition: opacity .25s ease; }
  @media (min-width: 601px) { .modal-backdrop { align-items: center; padding: 20px; } }
  .modal-backdrop.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    width: 100%; max-width: 100%; max-height: 92vh; overflow-y: auto;
    transform: translateY(100%);
    transition: transform .32s cubic-bezier(0.32, 0.72, 0, 1);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (min-width: 601px) {
    .modal { border-radius: 16px; max-width: 540px; transform: translateY(16px); transition: transform .25s ease; }
  }
  .modal-backdrop.open .modal { transform: translateY(0); }
  /* Drag handle on mobile */
  .modal::before {
    content: ''; display: block; width: 36px; height: 4px;
    background: var(--border); border-radius: 2px;
    margin: 12px auto 0; flex-shrink: 0;
  }
  @media (min-width: 601px) { .modal::before { display: none; } }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .modal-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 300; color: var(--gold); letter-spacing: -0.015em; }
  .modal-close { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; border-radius: 4px; font-size: 18px; transition: color var(--transition); line-height:1; }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; padding: 16px 24px 20px; border-top: 1px solid var(--border); }

  /* FIELDS */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; }
  .field input, .field select, .field textarea { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 13px; font-family: inherit; outline: none; transition: border-color var(--transition); width: 100%; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold-dim); }
  .field textarea { resize: vertical; min-height: 72px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* HALF STAR */
  .half-star-picker { display: flex; gap: 4px; align-items: center; user-select: none; }
  .half-star-picker.disabled { opacity: .35; pointer-events: none; }
  .hs-star { position: relative; width: 28px; height: 28px; cursor: pointer; }
  .hs-star svg { width: 28px; height: 28px; display: block; }
  .hs-left  { position: absolute; top: 0; left: 0;   height: 100%; width: 50%; cursor: pointer; }
  .hs-right { position: absolute; top: 0; right: 0;  height: 100%; width: 50%; cursor: pointer; }
  .hs-value { font-size: 12px; color: var(--text-muted); margin-left: 6px; min-width: 24px; }

  /* OWNER TOGGLE */
  .owner-toggle { display: flex; gap: 8px; }
  .owner-btn { flex: 1; padding: 10px; border-radius: 8px; font-size: 13px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; transition: all var(--transition); font-family: inherit; }
  .owner-btn.sel-law  { border-color: var(--law);  background: rgba(123,156,190,.1); color: var(--law); }
  .owner-btn.sel-mily { border-color: var(--mily); background: rgba(190,123,156,.1); color: var(--mily); }

  /* TOGGLE */
  .probado-toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .toggle-track { width: 40px; height: 22px; border-radius: 100px; background: var(--border); position: relative; transition: background var(--transition); flex-shrink: 0; }
  .toggle-track.on { background: var(--gold); }
  .toggle-thumb { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left var(--transition); }
  .toggle-track.on .toggle-thumb { left: 21px; }

  /* ADD TABS */
  .add-tabs { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .add-tab { flex: 1; padding: 9px; font-size: 12px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-family: inherit; transition: all var(--transition); text-align: center; }
  .add-tab.active { background: var(--gold); color: #0c0c0e; font-weight: 500; }

  /* DETAIL */
  .detail-img-wrap { width: 100%; aspect-ratio: 4/3; background: var(--surface2); overflow: hidden; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  .detail-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .detail-img-searching { display: flex; flex-direction: column; gap: 10px; align-items: center; color: var(--text-muted); font-size: 12px; }
  .detail-name { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 400; line-height: 1.2; letter-spacing: -0.02em; }
  .detail-brand { color: var(--text-muted); font-size: 13px; letter-spacing: .04em; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .detail-field { background: var(--surface2); border-radius: 8px; padding: 12px; }
  .detail-field-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px; }
  .img-controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .rating-locked { font-size: 11px; color: var(--gold-dim); font-style: italic; }
  .hint { font-size: 11px; color: var(--text-muted); font-style: italic; }

  /* TOAST */
  .toast { position: fixed; bottom: 24px; right: 24px; z-index: 999; background: var(--surface); border: 1px solid var(--gold-dim); color: var(--text); padding: 12px 18px; border-radius: 10px; font-size: 13px; box-shadow: 0 8px 32px rgba(0,0,0,.5); transform: translateY(16px); opacity: 0; transition: all .25s ease; pointer-events: none; }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .card { transition: border-color var(--transition), box-shadow var(--transition); }
    .card:hover { transform: none; }
    .card:active { transform: none; }
    .btn:active { transform: none; }
    .tab:active { transform: none; }
    .filter-chip:active { transform: none; }
    .modal { transition: opacity 150ms ease; transform: none !important; }
    .modal-backdrop { transition: opacity 150ms ease; }
    .card-img-loading { animation: none; background: var(--surface2); }
    .spinner { animation: none; opacity: 0.4; }
    @keyframes pulse { to { opacity: 1; } }
  }
  @media (prefers-reduced-transparency: reduce) {
    header { background: var(--bg); backdrop-filter: none; }
  }


  /* ══ SHOWCASE MODAL (animación estilo Lottie) ══ */
  .showcase-backdrop {
    position: fixed; inset: 0; z-index: 300;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease;
  }
  .showcase-backdrop.open { opacity: 1; pointer-events: all; }

  .showcase-bg {
    position: absolute; inset: 0;
    background: #000;
    opacity: 0;
    transition: opacity .25s ease;
  }
  .showcase-backdrop.open .showcase-bg { opacity: .88; }

  .showcase-card {
    position: relative; z-index: 1;
    width: min(420px, 92vw);
    aspect-ratio: 4/5;
    border-radius: 28px;
    overflow: hidden;
    transform: scale(.88);
    transition: transform .5s cubic-bezier(0.32, 0.72, 0, 1);
    box-shadow: 0 32px 80px rgba(0,0,0,.7);
  }
  .showcase-backdrop.open .showcase-card { transform: scale(1); }

  /* Fondo degradado por owner */
  .showcase-card-bg {
    position: absolute; inset: 0;
    background: linear-gradient(155deg, #0d1117 0%, #0d1117 40%, #141416 100%);
    z-index: 0;
  }
  .showcase-card-bg.law-bg {
    background: linear-gradient(155deg, #0a1628 0%, #0d1e38 45%, #091423 100%);
  }
  .showcase-card-bg.mily-bg {
    background: linear-gradient(155deg, #1a0d1a 0%, #280d22 45%, #150a14 100%);
  }

  /* Partículas decorativas */
  .showcase-particles {
    position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none;
  }
  .showcase-particles span {
    position: absolute; border-radius: 50%;
    animation: particle-float linear infinite;
    opacity: 0;
  }
  @keyframes particle-float {
    0%   { opacity: 0; transform: translateY(0) scale(0); }
    10%  { opacity: .6; }
    90%  { opacity: .2; }
    100% { opacity: 0; transform: translateY(-120px) scale(1.5); }
  }

  /* Imagen del perfume */
  .showcase-img-wrap {
    position: absolute;
    top: 0; left: 0; right: 0;
    bottom: 36%;          /* deja espacio al contenido abajo */
    z-index: 2;
    transform-origin: center center;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .showcase-backdrop.open .showcase-img-wrap {
    animation: img-settle .95s cubic-bezier(0.32, 0.72, 0, 1) forwards;
  }
  @keyframes img-settle {
    0%   { transform: scale(1.5); }
    60%  { transform: scale(0.94); }
    78%  { transform: scale(1.03); }
    90%  { transform: scale(0.99); }
    100% { transform: scale(1); }
  }
  .showcase-img-wrap img {
    width: 100%; height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 24px 48px rgba(0,0,0,.7));
    padding: 24px 32px 8px;
  }
  .showcase-img-placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  .showcase-img-placeholder svg { opacity: .15; }

  /* Gradiente bottom */
  .showcase-gradient {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 55%; z-index: 3;
    background: linear-gradient(to top, rgba(0,0,0,.98) 40%, rgba(0,0,0,.5) 70%, transparent 100%);
    pointer-events: none;
  }

  /* Contenido de texto */
  .showcase-content {
    position: absolute; bottom: 0; left: 0; right: 0;
    z-index: 4; padding: 28px 28px 24px;
  }

  /* Badge owner */
  .showcase-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 100px; font-size: 11px;
    font-weight: 500; letter-spacing: .06em; margin-bottom: 12px;
    opacity: 0; transform: translateY(8px);
    transition: opacity .3s ease, transform .3s ease;
  }
  .showcase-backdrop.open .showcase-badge {
    opacity: 1; transform: translateY(0);
    transition-delay: .5s;
  }
  .showcase-badge.law  { background: rgba(123,156,190,.2); color: var(--law);  border: 1px solid rgba(123,156,190,.3); }
  .showcase-badge.mily { background: rgba(190,123,156,.2); color: var(--mily); border: 1px solid rgba(190,123,156,.3); }

  /* Nombre — stagger por palabra */
  .showcase-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(26px, 6vw, 36px);
    font-weight: 300; line-height: 1.1;
    letter-spacing: -0.02em;
    color: #fff; margin-bottom: 6px;
    overflow: hidden;
  }
  .showcase-name .word {
    display: inline-block;
    opacity: 0; transform: translateY(100%);
    animation: word-appear .45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes word-appear {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Marca */
  .showcase-brand {
    font-size: 12px; color: rgba(255,255,255,.45);
    letter-spacing: .12em; text-transform: uppercase;
    opacity: 0; transform: translateY(6px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .showcase-backdrop.open .showcase-brand {
    opacity: 1; transform: translateY(0);
  }

  /* Stars */
  .showcase-stars {
    display: flex; gap: 2px; margin-top: 10px;
    opacity: 0; transform: translateY(6px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .showcase-backdrop.open .showcase-stars {
    opacity: 1; transform: translateY(0);
  }

/* ══ ESTADO LOCAL ══ */
let perfumes      = [];   // espejo local del snapshot

let sortKey       = 'name';

let detailId      = null;

let addRating     = 0;

/* ══ SYNC DOT ══ */
function syncDot(state) {  // 'syncing' | 'ok' | 'err'
  const el = document.getElementById('syncDot');
  el.className = 'sync-dot ' + state;
}

/* ══ FIRESTORE HELPERS ══ */
async function fsSet(id, data) {
  syncDot('syncing');
  try {
    await setDoc(doc(db, COL, id), { ...data, updatedAt: serverTimestamp() });
    syncDot('ok');
  } catch(e) { console.error(e); syncDot('err'); toast('Error al guardar ⚠️'); }
}
async function fsDel(id) {
  syncDot('syncing');
  try {
    await deleteDoc(doc(db, COL, id));
    syncDot('ok');
  } catch(e) { console.error(e); syncDot('err'); toast('Error al eliminar ⚠️'); }
}

/* ══ TIENDAS HELPERS ══ */
async function loadTiendas() {
  try {
    const snap = await getDocs(query(collection(db, COL_TIENDAS), orderBy('nombre')));
    tiendas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(e) { console.error('Error cargando tiendas:', e); }
}

async function saveTienda(id, data) {
  syncDot('syncing');
  try {
    if (id && id.trim() !== '') {
      await setDoc(doc(db, COL_TIENDAS, id.trim()), { nombre: data.nombre, direccion: data.direccion || '', updatedAt: serverTimestamp() });
    } else {
      await addDoc(collection(db, COL_TIENDAS), { nombre: data.nombre, direccion: data.direccion || '', createdAt: serverTimestamp() });
    }
    await loadTiendas();
    syncDot('ok');
  } catch(e) { console.error(e); syncDot('err'); toast('Error al guardar tienda ⚠️'); }
}

async function deleteTienda(id) {
  if (!confirm('¿Eliminar esta tienda?')) return;
  syncDot('syncing');
  try {
    await deleteDoc(doc(db, COL_TIENDAS, id));
    await loadTiendas();
    syncDot('ok');
    toast('Tienda eliminada');
  } catch(e) { console.error(e); syncDot('err'); }
}

/* ══ PRECIOS HELPERS ══ */
async function loadPrecios(perfumeId) {
  try {
    const snap = await getDocs(
      query(collection(db, COL_PRECIOS, perfumeId, 'registros'), orderBy('fecha', 'desc'))
    );
    preciosCache[perfumeId] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    return preciosCache[perfumeId];
  } catch(e) { console.error('Error cargando precios:', e); return []; }
}

async function savePrecio(perfumeId, data) {
  syncDot('syncing');
  try {
    await addDoc(collection(db, COL_PRECIOS, perfumeId, 'registros'), {
      ...data,
      fecha: serverTimestamp(),
      fechaStr: new Date().toLocaleDateString('es-PA', { day:'2-digit', month:'short', year:'numeric' })
    });
    delete preciosCache[perfumeId]; // invalidar cache
    syncDot('ok');
    toast('Precio registrado ✓');
  } catch(e) { console.error(e); syncDot('err'); toast('Error al registrar precio ⚠️'); }
}

async function deletePrecio(perfumeId, precioId) {
  if (!confirm('¿Eliminar este registro de precio?')) return;
  try {
    await deleteDoc(doc(db, COL_PRECIOS, perfumeId, 'registros', precioId));
    delete preciosCache[perfumeId];
    toast('Registro eliminado');
    // Refrescar panel
    openDetail(perfumeId);
  } catch(e) { console.error(e); }
}

/* ══ IMAGEN ══ */
async function fetchImage(p, skip = 0) {
  if (!SCRIPT_URL) return null;
  try {
    const url = `${SCRIPT_URL}?name=${encodeURIComponent(p.name)}&brand=${encodeURIComponent(p.brand)}&skip=${skip}`;
    const r = await fetch(url);
    if (!r.ok) return null;
    const d = await r.json();
    return d.imageUrl || null;
  } catch { return null; }
}

/* ══ ESTRELLAS ══ */
function starSVG(type, size=20) {
  const id = 'hg'+Math.random().toString(36).slice(2,6);
  if (type==='full')  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26" fill="#c9a96e" stroke="none"/></svg>`;
  if (type==='half')  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><defs><linearGradient id="${id}"><stop offset="50%" stop-color="#c9a96e"/><stop offset="50%" stop-color="transparent"/></linearGradient></defs><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26" fill="url(#${id})" stroke="#2a2a30" stroke-width="1.5"/></svg>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26" fill="transparent" stroke="#2a2a30" stroke-width="1.5"/></svg>`;
}
function starsHTML(rating, size=14) {
  let h='';
  for(let i=1;i<=5;i++) h += starSVG(rating>=i?'full':rating>=i-.5?'half':'empty', size);
  return h;
}
function buildStarPicker(containerId, getR, setR) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = '';
  for(let i=1;i<=5;i++) {
    const wrap = document.createElement('div'); wrap.className='hs-star';
    wrap.innerHTML = starSVG('empty',28);
    const half=document.createElement('div'); half.className='hs-left';
    const full=document.createElement('div'); full.className='hs-right';
    half.onclick = e=>{ e.stopPropagation(); setR(i-.5); refreshPicker(containerId,getR()); };
    full.onclick = e=>{ e.stopPropagation(); setR(i);    refreshPicker(containerId,getR()); };
    wrap.appendChild(half); wrap.appendChild(full); el.appendChild(wrap);
  }
  const val=document.createElement('span'); val.className='hs-value'; val.id=containerId+'Val';
  el.appendChild(val);
  refreshPicker(containerId, getR());
}
function refreshPicker(containerId, rating) {
  const el = document.getElementById(containerId); if(!el) return;
  el.querySelectorAll('.hs-star').forEach((s,idx)=>{
    const n=idx+1, type=rating>=n?'full':rating>=n-.5?'half':'empty';
    const svg=s.querySelector('svg');
    const tmp=document.createElement('div'); tmp.innerHTML=starSVG(type,28);
    svg.replaceWith(tmp.firstChild);
  });
  const v=document.getElementById(containerId+'Val');
  if(v) v.textContent = rating>0 ? rating.toFixed(1) : '—';
}

/* ══ RENDER ══ */
function filtered() {
  let list = [...perfumes];
  if (filterOwner   !== 'all') list = list.filter(p=>p.owner===filterOwner);
  if (filterProbado === 'probado')   list = list.filter(p=>p.probado);
  if (filterProbado === 'noprobado') list = list.filter(p=>!p.probado);
  if (searchQ) { const q=searchQ.toLowerCase(); list=list.filter(p=>p.name.toLowerCase().includes(q)||p.brand.toLowerCase().includes(q)); }
  switch(sortKey) {
    case 'rating':  list.sort((a,b)=>b.rating-a.rating); break;
    case 'price':   list.sort((a,b)=>(parseFloat(a.price)||9999)-(parseFloat(b.price)||9999)); break;
    case 'probado': list.sort((a,b)=>(b.probado?1:0)-(a.probado?1:0)); break;
    default:        list.sort((a,b)=>a.name.localeCompare(b.name));
  }
  return list;
}

function startListener() {
  onSnapshot(collection(db, COL), snap => {
    perfumes = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    render();
    // seed si está vacío
    if (perfumes.length === 0) seedInitial();
    // ocultar loading
    const ls = document.getElementById('loadingScreen');
    if (ls) {
      ls.classList.add('hide');
      setTimeout(() => {
        ls.remove();
        // Stagger entrance for cards
        document.querySelectorAll('.card').forEach((card, i) => {
          card.style.opacity = '0';
          card.style.transform = 'translateY(12px)';
          card.style.transition = 'none';
          requestAnimationFrame(() => {
            setTimeout(() => {
              card.style.transition = 'opacity .3s ease, transform .3s ease';
              card.style.opacity = '1';
              card.style.transform = '';
              setTimeout(() => { card.style.transition = ''; card.style.transform = ''; }, 350);
            }, Math.min(i * 30, 300));
          });
        });
      }, 400);
    }
    syncDot('ok');
  }, err => { console.error(err); syncDot('err'); });
}

async function rebuscarImagen(id) {
  const p = perfumes.find(x => x.id === id);
  if (!p || !SCRIPT_URL) { toast('Script no configurado'); return; }

  const btn  = document.getElementById('btnRebuscar');
  const wrap = document.getElementById('dImgWrap');

  if (btn)  { btn.disabled = true; btn.innerHTML = '<div class="spinner" style="width:14px;height:14px;border-width:2px"></div> Buscando…'; }
  if (wrap) wrap.innerHTML = '<div class="detail-img-searching"><div class="spinner"></div><span>Buscando imagen…</span></div>';

  // Historial de URLs ya vistas para este perfume
  const usedUrls = Array.isArray(p.imgHistory) ? [...p.imgHistory] : (p.img ? [p.img] : []);
  let found = null;
  let triedSkips = 0;
  const MAX_TRIES = 12;

  // Probar hasta MAX_TRIES skips distintos buscando una URL no usada
  let skip = (p.imgIndex || 0) + 1;
  while (triedSkips < MAX_TRIES) {
    const candidate = await fetchImage(p, skip % MAX_TRIES);
    triedSkips++;
    if (candidate && !usedUrls.includes(candidate)) {
      found = candidate;
      break;
    }
    skip++;
  }

  // Si no encontramos nada nuevo, limpiar historial y empezar de nuevo
  if (!found) {
    skip = 0;
    found = await fetchImage(p, 0);
    usedUrls.length = 0; // resetear historial
    toast('Historial completo, volviendo al inicio');
  }

  const newHistory = found ? [...usedUrls, found].slice(-15) : usedUrls; // máx 15 en historial
  const updated = { ...p, img: found || p.img, imgFetched: true, imgIndex: skip % MAX_TRIES, imgHistory: newHistory };
  await fsSet(id, updated);

  if (wrap) wrap.innerHTML = found
    ? `<img src="${found}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover">`
    : `<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="opacity:.2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;

  const inp = document.getElementById('dImgUrl');
  if (inp && found) inp.value = found;

  if (btn) { btn.disabled = false; btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.77"/></svg> Buscar otra'; }

  toast(found ? `Nueva imagen encontrada ✓ (${newHistory.length} vistas)` : 'No se encontraron más imágenes');
}

async function aplicarUrlImagen(id) {
  const url=(document.getElementById('dImgUrl')?.value||'').trim();
  if(!url){ toast('Pega una URL primero'); return; }
  const p=perfumes.find(x=>x.id===id); if(!p) return;
  await fsSet(id,{ ...p, img:url, imgFetched:true });
  const wrap=document.getElementById('dImgWrap');
  if(wrap) wrap.innerHTML=`<img src="${url}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover">`;
  document.getElementById('imgUrlPanel').style.display='none';
  toast('Imagen actualizada ✓');
}

/* ══ TOAST ══ */
let toastTimer;
function toast(msg) {
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2600);
}

/* ══ EXPONER AL HTML (onclick en strings) ══ */
window._openDetail       = openDetail;
window._saveDetail       = saveDetail;
window._deletePerfume    = deletePerfume;
window._rebuscarImagen   = rebuscarImagen;
window._aplicarUrlImagen = aplicarUrlImagen;
window._toggleImgUrl     = toggleImgUrl;
window.toggleDetailProbado = toggleDetailProbado;

/* ══ EVENTOS ══ */
document.getElementById('btnAddOpen').onclick     = openAddModal;
document.getElementById('addModalClose').onclick  = closeAddModal;
document.getElementById('addModalCancel').onclick = closeAddModal;
document.getElementById('addModalSave').onclick   = saveAdd;
document.getElementById('detailModalClose').onclick = closeDetailModal;
document.querySelectorAll('.add-tab').forEach(b=>b.onclick=()=>switchAddTab(b.dataset.atab));
document.getElementById('ownerLaw').onclick  = ()=>setAddOwner('law');
document.getElementById('ownerMily').onclick = ()=>setAddOwner('mily');
document.getElementById('bulkLaw').onclick   = ()=>setBulkOwner('law');
document.getElementById('bulkMily').onclick  = ()=>setBulkOwner('mily');
document.getElementById('probadoToggle').onclick = () => {
  setAddProbado(!addProbado);
  if ('vibrate' in navigator) navigator.vibrate(8);
};
document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick=()=>{
    filterOwner=tab.dataset.filter;
    document.querySelectorAll('.tab').forEach(t=>{
      t.className='tab';
      if(t.dataset.filter===filterOwner) t.classList.add(filterOwner==='all'?'active-all':filterOwner==='law'?'active-law':'active-mily');
    });
    render();
  };
});
document.querySelectorAll('[data-prob]').forEach(chip=>{
  chip.onclick=()=>{
    filterProbado=chip.dataset.prob;
    document.querySelectorAll('[data-prob]').forEach(c=>c.classList.toggle('active-chip',c.dataset.prob===filterProbado));
    render();
  };
});
document.getElementById('sortSelect').onchange = e=>{ sortKey=e.target.value; render(); };
document.getElementById('searchInput').oninput  = e=>{ searchQ=e.target.value; render(); };
document.getElementById('addModal').onclick    = e=>{ if(e.target===e.currentTarget) closeAddModal(); };
document.getElementById('detailModal').onclick = e=>{ if(e.target===e.currentTarget) closeDetailModal(); };
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeAddModal(); closeDetailModal(); closeShowcase(); closeTiendasModal(); } });



/* ══ TIENDAS MODAL ══ */
function openTiendasModal() {
  renderTiendasBody();
  document.getElementById('tiendasModal').classList.add('open');
}
function closeTiendasModal() {
  document.getElementById('tiendasModal').classList.remove('open');
}

function renderTiendasBody() {
  const body = document.getElementById('tiendasBody');
  if (!body) return;

  const lista = tiendas.length === 0
    ? `<p style="color:var(--text-muted);font-size:13px;text-align:center;padding:16px 0">Sin tiendas aún</p>`
    : tiendas.map(t => `
      <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
        <div style="flex:1">
          <div style="font-size:14px">${t.nombre}</div>
          ${t.direccion ? `<div style="font-size:11px;color:var(--text-muted)">${t.direccion}</div>` : ''}
        </div>
        <button class="btn btn-outline btn-sm" onclick="openEditTiendaForm('${t.id}')">✏️</button>
        <button class="btn btn-outline btn-sm" onclick="window._deleteTienda('${t.id}')" style="color:var(--text-muted)">✕</button>
      </div>`).join('');

  body.innerHTML = `
    <div id="tiendaFormPanel" style="display:none;flex-direction:column;gap:12px;background:var(--surface2);border-radius:10px;padding:14px;margin-bottom:4px">
      <input type="hidden" id="tFormId">
      <div class="field"><label>Nombre *</label><input type="text" id="tNombre" placeholder="Ej: El Machetazo"></div>
      <div class="field"><label>Ubicación / Notas</label><input type="text" id="tDireccion" placeholder="Ej: Albrook Mall, piso 2"></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline" style="flex:1" onclick="closeTiendaForm()">Cancelar</button>
        <button class="btn btn-gold" style="flex:1" onclick="saveTiendaForm()">Guardar</button>
      </div>
    </div>
    <div id="tiendaList">${lista}</div>
  `;
}

function openAddTiendaForm() {
  renderTiendasBody();
  const p = document.getElementById('tiendaFormPanel');
  if (!p) return;
  document.getElementById('tFormId').value = '';
  document.getElementById('tNombre').value = '';
  document.getElementById('tDireccion').value = '';
  p.style.display = 'flex';
  setTimeout(() => document.getElementById('tNombre')?.focus(), 50);
}

function openEditTiendaForm(id) {
  const t = tiendas.find(x => x.id === id); if (!t) return;
  const p = document.getElementById('tiendaFormPanel');
  if (!p) return;
  document.getElementById('tFormId').value = id;
  document.getElementById('tNombre').value = t.nombre || '';
  document.getElementById('tDireccion').value = t.direccion || '';
  p.style.display = 'flex';
}

function closeTiendaForm() {
  const p = document.getElementById('tiendaFormPanel');
  if (p) p.style.display = 'none';
}

async function saveTiendaForm() {
  const nombre = document.getElementById('tNombre')?.value.trim();
  if (!nombre) { toast('El nombre es requerido'); return; }
  const id        = document.getElementById('tFormId')?.value || null;
  const direccion = document.getElementById('tDireccion')?.value.trim() || '';
  await saveTienda(id || null, { nombre, direccion });
  // saveTienda ya llama loadTiendas internamente — solo re-renderizar
  renderTiendasBody();
  toast('Tienda guardada ✓');
}

window._deleteTienda  = deleteTienda;
window._deletePrecio  = deletePrecio;
window._registrarPrecio = registrarPrecio;

/* ══ SHOWCASE ══ */
let showcaseCurrentId = null;

function openShowcase(id) {
  const p = perfumes.find(x => x.id === id);
  if (!p) return;
  showcaseCurrentId = id;

  const isLaw = p.owner === 'law';
  const accent1 = isLaw ? 'rgba(123,156,190,0.25)' : 'rgba(190,123,156,0.25)';
  const accent2 = isLaw ? 'rgba(61,90,120,0.2)'    : 'rgba(120,61,90,0.2)';

  // Fondo
  const bg = document.getElementById('showcaseBg');
  bg.className = `showcase-card-bg ${p.owner}-bg`;

  // Accents de color
  document.getElementById('showcaseAccent1').style.background = accent1;
  document.getElementById('showcaseAccent2').style.background = accent2;

  // Imagen
  const wrap = document.getElementById('showcaseImgWrap');
  if (p.img) {
    wrap.innerHTML = `<img src="${p.img}" alt="${p.name}">`;
  } else {
    wrap.innerHTML = `<div class="showcase-img-placeholder">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width=".8">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
    </div>`;
  }

  // Badge
  const badge = document.getElementById('showcaseBadge');
  badge.className = `showcase-badge ${p.owner}`;
  badge.innerHTML = p.owner === 'law' ? '🔵 Law' : '🩷 Mily';

  // Nombre con stagger por palabra
  const words = p.name.split(' ');
  document.getElementById('showcaseName').innerHTML = words
    .map((w, i) => `<span class="word" style="animation-delay:${.52 + i * .06}s">${w}</span>`)
    .join('<span style="display:inline-block;width:.3em"></span>');

  // Brand
  const brandEl = document.getElementById('showcaseBrand');
  brandEl.textContent = p.brand || '';
  brandEl.style.transitionDelay = `${.52 + words.length * .06 + .1}s`;

  // Stars
  const starsEl = document.getElementById('showcaseStars');
  if (p.rating && p.probado) {
    starsEl.innerHTML = starsHTML(p.rating, 16);
    starsEl.style.transitionDelay = `${.6 + words.length * .06}s`;
    starsEl.style.display = 'flex';
  } else {
    starsEl.style.display = 'none';
  }

  // Meta chips
  const meta = document.getElementById('showcaseMeta');
  const chips = [];
  if (p.probado) chips.push('✓ Probado');
  if (p.ocasion) chips.push(p.ocasion);
  if (p.price)   chips.push(p.price);
  if (p.lugar)   chips.push(p.lugar);
  meta.innerHTML = chips
    .map((ch, i) => `<span class="showcase-chip" style="transition-delay:${.65 + i * .06 + words.length * .04}s">${ch}</span>`)
    .join('');

  // Botón delay
  document.getElementById('showcaseBtn').style.transitionDelay = `${.75 + words.length * .04}s`;

  // Partículas
  spawnParticles(p.owner);

  // Abrir
  document.getElementById('showcaseModal').classList.add('open');

  // Haptic
  if ('vibrate' in navigator) navigator.vibrate(6);
}

function spawnParticles(owner) {
  const container = document.getElementById('showcaseParticles');
  container.innerHTML = '';
  const color = owner === 'law' ? '#7b9cbe' : '#be7b9c';
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('span');
    const size = Math.random() * 4 + 2;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      background:${color};
      left:${Math.random() * 100}%;
      bottom:${Math.random() * 60}%;
      animation-duration:${3 + Math.random() * 4}s;
      animation-delay:${Math.random() * 2}s;
    `;
    container.appendChild(s);
  }
}

function closeShowcase() {
  document.getElementById('showcaseModal').classList.remove('open');
  setTimeout(() => {
    document.getElementById('showcaseParticles').innerHTML = '';
    document.getElementById('showcaseImgWrap').innerHTML = '';
  }, 400);
}

function openDetailFromShowcase() {
  closeShowcase();
  setTimeout(() => {
    if (showcaseCurrentId) openDetail(showcaseCurrentId);
  }, 320);
}

window._openShowcase          = openShowcase;
window._openDetail            = openDetail;
window.closeShowcase          = closeShowcase;
window.openDetailFromShowcase = openDetailFromShowcase;
window.openTiendasModal       = openTiendasModal;
window.closeTiendasModal      = closeTiendasModal;
window.switchDetailTab        = switchDetailTab;
window.toggleDetailProbado    = toggleDetailProbado;
window.setDetailOwner         = setDetailOwner;
window.openAddTiendaForm      = openAddTiendaForm;
window.openEditTiendaForm     = openEditTiendaForm;
window.closeTiendaForm        = closeTiendaForm;

loadTiendas();

window.addEventListener('scroll', () => {
  document.querySelector('header').classList.toggle('scrolled', window.scrollY > 4);
}, { passive: true });

startListener();
</script>
